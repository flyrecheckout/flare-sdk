name: Publish

# Publica no PyPI quando uma release do GitHub é criada. Usa Trusted Publishing
# (OIDC): o PyPI confia neste repositório/workflow por identidade, então NÃO há
# token nem senha guardados em secret. Pré-requisitos (feitos uma vez, por um
# humano, no site do PyPI):
#   1. Criar o projeto `flare-sdk` no PyPI.
#   2. Em "Publishing", adicionar um publisher confiável apontando para
#      londarks/flare-sdk, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # exigido pelo OIDC do Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

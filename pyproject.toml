[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flare-sdk"
version = "0.4.0"
description = "Cliente leve para enviar logs e requests ao Flare (observabilidade da lunacheckout)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Gabriel", email = "ondarks360@gmail.com" }]
keywords = ["observability", "logging", "telemetry", "flare", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

# O core não depende de NADA além da stdlib: o transporte usa `urllib`. Um SDK de
# telemetria que arrasta httpx/requests para dentro de dez apps multiplica conflito
# de versão por dez — o custo de integrar tem de ser "pip install e pronto".
dependencies = []

[project.optional-dependencies]
# O middleware de FastAPI importa `starlette` — mas quem instala o extra JÁ tem
# FastAPI (é a app dele). O extra existe para documentar a intenção, não para puxar
# um framework web para quem só quer o handler de log.
fastapi = ["starlette>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "starlette>=0.27",
    "httpx>=0.27",       # TestClient do Starlette
]

[project.urls]
Homepage = "https://github.com/flyrecheckout/flare-sdk"
Repository = "https://github.com/flyrecheckout/flare-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/flare_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A raiz no path para que `from tests.conftest import ...` resolva tanto sob
# `pytest` (console script) quanto `python -m pytest` — sem isto, o console
# script não põe o cwd no sys.path e a coleta morre em ModuleNotFoundError.
pythonpath = ["."]
addopts = [
    "--cov=flare_sdk",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["flare_sdk"]
